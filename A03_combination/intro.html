<!DOCTYPE html>

<html class="h-full" lang="ko">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        name="viewport" />
    <title>SK브로드밴드 AI상담사 콜비</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&amp;display=swap"
        rel="stylesheet" />
    <link href="../css/common.css" rel="stylesheet" />
</head>

<body class="h-full w-full bg-white overflow-hidden flex flex-col">
    <!-- 상단 헤더 -->
    <div class="pt-4 px-4 pb-2 bg-white z-30 flex justify-between items-center h-14 shrink-0">
        <button class="p-2 -ml-2 text-gray-800 active:bg-gray-100 rounded-full transition-colors"
            onclick="location.href='../index.html'">
            <i class="w-7 h-7" data-lucide="home"></i>
        </button>
        <h1 class="text-[18px] font-bold text-gray-900">유무선 결합 신청</h1>
        <div class="flex items-center gap-1 cursor-pointer px-2 py-1">
            <span class="text-sm font-bold text-gray-900">종료</span>
            <i class="text-gray-900 w-4 h-4" data-lucide="phone-off"></i>
        </div>
    </div>
    <!-- 메인 컨테이너 -->
    <div class="flex-1 overflow-y-auto scrollbar-hide px-6 pt-4 relative flex flex-col scroll-smooth"
        id="main-scroll-container">
        <!-- 타이핑 텍스트 영역 -->
        <div class="min-h-[30px] flex items-center justify-start join-typing-area shrink-0" id="typing-area">
            <span class="text-[#2563EB] font-bold text-[17px]" id="typing-text"></span>
            <span class="inline-block w-[2px] h-5 bg-[#2563EB] ml-1 cursor-blink" id="cursor"></span>
        </div>
        <!-- 바운스 콘텐츠 -->
        <div class="w-full opacity-0" id="main-content-body">
            <div class="flex flex-col h-full bg-white px-1">
                <div class="join-step-header mb-8 relative" id="target-anchor">
                    <!-- Minimalist Font Control -->
                    <div class="absolute right-0 top-1 flex gap-1.5 pointer-events-auto">
                        <button onclick="adjustFontSize(-1)"
                            class="w-7 h-7 bg-white rounded-full border border-gray-200 shadow-sm flex items-center justify-center text-gray-500 hover:text-blue-600 hover:border-blue-200 active:scale-90 transition-all">
                            <i data-lucide="minus" class="w-3.5 h-3.5"></i>
                        </button>
                        <button onclick="adjustFontSize(1)"
                            class="w-7 h-7 bg-white rounded-full border border-gray-200 shadow-sm flex items-center justify-center text-gray-500 hover:text-blue-600 hover:border-blue-200 active:scale-90 transition-all">
                            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                    <h2 class="text-[20px] font-extrabold text-[#1a1a1a] leading-tight"><span class="text-black">결합
                            혜택을</span><br />확인하고 신청해 주세요.</h2>
                </div>
                <div class="join-step-content flex-1 space-y-6">
                    <div class="flex justify-center gap-6 mb-4">
                        <div
                            class="w-20 h-20 bg-blue-50 rounded-full flex items-center justify-center border border-blue-100 shadow-sm relative group">
                            <span class="text-3xl group-hover:scale-110 transition-transform">📱</span>
                            <div
                                class="absolute -top-1 -right-1 w-5 h-5 bg-[#5031E5] rounded-full flex items-center justify-center text-white font-bold text-[9px] animate-bounce">
                                UP</div>
                        </div>
                        <div class="flex items-center text-gray-300 animate-pulse">
                            <i data-lucide="plus" class="w-5 h-5"></i>
                        </div>
                        <div
                            class="w-20 h-20 bg-green-50 rounded-full flex items-center justify-center border border-green-100 shadow-sm relative group">
                            <span class="text-3xl group-hover:scale-110 transition-transform">🌐</span>
                        </div>
                    </div>
                    <div class="bg-[#F8F9FA] rounded-[20px] p-4 border border-gray-100 mb-3">
                        <h3 class="font-bold text-gray-900 mb-2 text-[15px]">주요 혜택 안내</h3>
                        <ul class="text-[13px] text-gray-600 space-y-1.5 list-none leading-snug">
                            <li class="flex items-start gap-2">
                                <span class="text-[#5031E5] font-bold">✓</span>
                                <span>인터넷 요금 매월 최대 <span class="text-[#5031E5] font-bold">11,000원</span> 할인</span>
                            </li>
                            <li class="flex items-start gap-2">
                                <span class="text-[#5031E5] font-bold">✓</span>
                                <span>휴대폰 요금 회선당 최대 <span class="text-[#5031E5] font-bold">3,300원</span> 할인</span>
                            </li>
                            <li class="flex items-start gap-2">
                                <span class="text-[#5031E5] font-bold">✓</span>
                                <span>가족 결합 시 추가 할인 혜택 제공</span>
                            </li>
                        </ul>
                    </div>
                    <div class="p-3 bg-orange-50 rounded-xl border border-orange-100">
                        <p class="text-[12px] text-orange-700 font-medium">※ 본인 인증 후 결합 가능 여부를 확인합니다.</p>
                    </div>
                </div>
                <!-- 신청 버튼 -->
                <div class="mt-auto pt-4 pb-6">
                    <button
                        class="w-full bg-[#5031E5] text-white py-4 rounded-xl text-[19px] font-bold shadow-lg hover:bg-[#4020d0] transition-transform active:scale-95 transition-all"
                        id="apply-btn" onclick="location.href='checking.html'">혜택 확인하고 시작하기</button>
                </div>
            </div>
        </div>
        <div class="w-full h-0 shrink-0" id="bottom-spacer"></div>
    </div>
    <script src="../js/agent_overlay.js"></script>
    <script src="../js/common_ui.js"></script>
    <script>
        // 페이지 개별 설정 및 UI 초기화
        const pageText = "결합 혜택 내용을 확인해 주세요.";
        initCommonUI(pageText);
    </script>
</body>

</html>
