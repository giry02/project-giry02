<!DOCTYPE html>
<html class="h-full" lang="ko">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        name="viewport" />
    <title>SK브로드밴드 AI상담사 콜비 - 상품 및 사은품 선택</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&amp;display=swap"
        rel="stylesheet" />
    <link href="../css/common.css" rel="stylesheet" />
</head>

<body class="h-full w-full bg-white overflow-hidden flex flex-col">
    <!-- 상단 헤더 -->
    <div class="pt-4 px-4 pb-2 bg-white z-30 flex justify-between items-center h-14 shrink-0">
        <button class="p-2 -ml-2 text-gray-800 active:bg-gray-100 rounded-full transition-colors"
            onclick="location.href='../index.html'">
            <i class="w-7 h-7" data-lucide="home"></i>
        </button>
        <h1 class="text-[18px] font-bold text-gray-900">바로가입</h1>
        <div class="flex items-center gap-1 cursor-pointer px-2 py-1" onclick="location.href='../index.html'">
            <span class="text-sm font-bold text-gray-900">종료</span>
            <i class="text-gray-900 w-4 h-4" data-lucide="phone-off"></i>
        </div>
    </div>

    <!-- 메인 컨테이너 -->
    <div class="flex-1 overflow-y-auto scrollbar-hide px-6 pt-4 relative flex flex-col scroll-smooth"
        id="main-scroll-container">
        <!-- 타이핑 텍스트 영역 -->
        <div class="min-h-[30px] flex items-center justify-start join-typing-area shrink-0" id="typing-area">
            <span class="text-[#2563EB] font-bold text-[17px]" id="typing-text"></span>
            <span class="inline-block w-[2px] h-5 bg-[#2563EB] ml-1 cursor-blink" id="cursor"></span>
        </div>

        <!-- 바운스 콘텐츠 -->
        <div class="w-full opacity-0" id="main-content-body">
            <div class="flex flex-col h-full bg-white px-1">
                <div class="join-step-header">
                    <div class="flex justify-end mb-2">
                        <div class="flex gap-1.5 bg-gray-50 rounded-lg p-1">
                            <button onclick="adjustFontSize(-1)"
                                class="w-8 h-8 flex items-center justify-center rounded-md bg-white border border-gray-200 shadow-sm active:scale-95 transition-all">
                                <i class="w-4 h-4 text-gray-600" data-lucide="minus"></i>
                            </button>
                            <button onclick="adjustFontSize(1)"
                                class="w-8 h-8 flex items-center justify-center rounded-md bg-white border border-gray-200 shadow-sm active:scale-95 transition-all">
                                <i class="w-4 h-4 text-gray-600" data-lucide="plus"></i>
                            </button>
                        </div>
                    </div>
                    <h2 class="text-[20px] font-extrabold text-[#1a1a1a] leading-tight">
                        원하시는 <span class="text-[#5031E5]">인터넷 상품</span>을<br />선택해 주세요.
                    </h2>
                </div>

                <div class="join-step-content join-section-gap space-y-3 flex-1">
                    <!-- 선택 상품 요약 -->
                    <div class="bg-indigo-50/50 rounded-[24px] p-6 border border-indigo-100">
                        <div class="flex justify-between items-start mb-4">
                            <span class="bg-indigo-600/10 text-indigo-600 text-[11px] font-bold px-2 py-1 rounded-md">기가
                                인터넷 + B tv</span>
                        </div>
                        <h3 class="text-[18px] font-bold text-gray-900 mb-1">Giga 인터넷 (1G) + B tv All</h3>
                        <p class="text-[13px] text-gray-500 font-medium">+ 스마트 3 셋톱박스 포함</p>

                        <div class="mt-4 pt-4 border-t border-indigo-100 flex justify-between items-center">
                            <span class="text-[14px] font-bold text-gray-400">월 예상 요금</span>
                            <span class="text-[18px] font-black text-indigo-600">46,200원</span>
                        </div>
                    </div>

                    <!-- 사은품 선택 -->
                    <div>
                        <h3 class="text-[16px] font-bold text-gray-900 mb-3 px-1">원하시는 사은품을 골라주세요</h3>
                        <div class="space-y-3">
                            <label
                                class="group relative flex items-center p-4 bg-white border border-gray-100 rounded-[20px] shadow-sm cursor-pointer transition-all active:scale-95 overflow-hidden">
                                <input type="radio" name="gift" class="peer sr-only" checked>

                                <!-- 배경 및 테두리 (Peer Sibling) -->
                                <div
                                    class="absolute inset-0 border-2 border-transparent peer-checked:border-[#5031E5] rounded-[20px] transition-all pointer-events-none z-10">
                                </div>
                                <div
                                    class="absolute inset-0 bg-indigo-50/0 peer-checked:bg-indigo-50/10 transition-all pointer-events-none">
                                </div>

                                <div
                                    class="w-16 h-16 bg-gray-50 rounded-xl flex items-center justify-center shrink-0 border border-gray-100 relative z-20">
                                    <span class="text-2xl">💰</span>
                                </div>
                                <div class="ml-4 flex-1 relative z-20">
                                    <p class="text-[15px] font-bold text-gray-900 group-peer-checked:text-[#5031E5]">현금
                                        사은품</p>
                                    <p class="text-[13px] text-gray-500 mt-0.5">최대 47만원 지급</p>
                                </div>

                                <!-- Circle Check Background (Peer Sibling) -->
                                <div
                                    class="relative w-6 h-6 border-2 border-gray-200 rounded-full bg-white transition-all peer-checked:bg-[#5031E5] peer-checked:border-[#5031E5] z-20">
                                </div>

                                <!-- Check Icon (Peer Sibling) -->
                                <div
                                    class="absolute right-4 top-1/2 -translate-y-1/2 w-6 h-6 flex items-center justify-center opacity-0 peer-checked:opacity-100 transition-opacity z-30 pointer-events-none">
                                    <i data-lucide="check" class="w-4 h-4 text-white"></i>
                                </div>
                            </label>

                            <label
                                class="group relative flex items-center p-4 bg-white border border-gray-100 rounded-[20px] shadow-sm cursor-pointer transition-all active:scale-95 overflow-hidden">
                                <input type="radio" name="gift" class="peer sr-only">
                                <div
                                    class="absolute inset-0 border-2 border-transparent peer-checked:border-[#5031E5] rounded-[20px] transition-all pointer-events-none z-10">
                                </div>
                                <div
                                    class="absolute inset-0 bg-indigo-50/0 peer-checked:bg-indigo-50/10 transition-all pointer-events-none">
                                </div>

                                <div
                                    class="w-16 h-16 bg-gray-50 rounded-xl flex items-center justify-center shrink-0 border border-gray-100 relative z-20">
                                    <span class="text-2xl">📺</span>
                                </div>
                                <div class="ml-4 flex-1 relative z-20">
                                    <p class="text-[15px] font-bold text-gray-900">삼성 50인치 TV</p>
                                    <p class="text-[13px] text-gray-500 mt-0.5">UHD 4K 스마트 TV</p>
                                </div>
                                <div
                                    class="relative w-6 h-6 border-2 border-gray-200 rounded-full bg-white transition-all peer-checked:bg-[#5031E5] peer-checked:border-[#5031E5] z-20 flex items-center justify-center">
                                    <i data-lucide="check"
                                        class="w-4 h-4 text-white opacity-0 peer-checked:opacity-100 transition-opacity"></i>
                                </div>
                            </label>

                            <label
                                class="group relative flex items-center p-4 bg-white border border-gray-100 rounded-[20px] shadow-sm cursor-pointer transition-all active:scale-95 overflow-hidden">
                                <input type="radio" name="gift" class="peer sr-only">
                                <div
                                    class="absolute inset-0 border-2 border-transparent peer-checked:border-[#5031E5] rounded-[20px] transition-all pointer-events-none z-10">
                                </div>
                                <div
                                    class="absolute inset-0 bg-indigo-50/0 peer-checked:bg-indigo-50/10 transition-all pointer-events-none">
                                </div>

                                <div
                                    class="w-16 h-16 bg-gray-50 rounded-xl flex items-center justify-center shrink-0 border border-gray-100 relative z-20">
                                    <span class="text-2xl">🎁</span>
                                </div>
                                <div class="ml-4 flex-1 relative z-20">
                                    <p class="text-[15px] font-bold text-gray-900">신세계 상품권</p>
                                    <p class="text-[13px] text-gray-500 mt-0.5">45만원 모바일 교환권</p>
                                </div>
                                <div
                                    class="relative w-6 h-6 border-2 border-gray-200 rounded-full bg-white transition-all peer-checked:bg-[#5031E5] peer-checked:border-[#5031E5] z-20 flex items-center justify-center">
                                    <i data-lucide="check"
                                        class="w-4 h-4 text-white opacity-0 peer-checked:opacity-100 transition-opacity"></i>
                                </div>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- 다음 버튼 -->
                <div class="mt-auto pt-4 pb-6">
                    <button
                        class="w-full bg-[#5031E5] text-white py-4 rounded-xl text-[19px] font-bold shadow-lg active:scale-95 transition-all"
                        onclick="location.href='step05_discount.html'">
                        다음으로
                    </button>
                </div>
            </div>
        </div>
        <div class="w-full h-80 shrink-0" id="bottom-spacer"></div>
    </div>

    <script src="../js/agent_overlay.js"></script>
    <script src="../js/common_ui.js"></script>
    <script>
        const pageText = "상품과 원하시는 사은품을 선택해 주세요.";
        initCommonUI(pageText);

        function selectGift(el) {
            // Re-render icons after change
            setTimeout(() => {
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }, 0);
        }
    </script>
</body>

</html>
